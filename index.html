<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammad — Video Editor | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* تم آرامش‌بخش: اقیانوس آرام — آبی تیره + فیروزه‌ای */
    --bg:#0a1220; --panel:rgba(255,255,255,.05); --border:rgba(140,190,220,.14);
    --text:#eef4f8; --muted:rgba(238,244,248,.55); --faint:rgba(238,244,248,.3);
    --accent:#38bdf8;        /* آبی روشن */
    --accent-soft:#7dd3fc;
    --teal:#2dd4bf;
    --radius:18px; --ease:cubic-bezier(.22,1,.36,1);
    --font-main:'Space Grotesk','Vazirmatn',system-ui,sans-serif;
  }
  html[dir="rtl"] body{font-family:'Vazirmatn','Space Grotesk',system-ui,sans-serif}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);line-height:1.9;font-family:var(--font-main)}

  .aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.32}
  .b1{width:46vw;height:46vw;top:-14%;right:-12%;background:#0369a1;animation:f1 26s ease-in-out infinite}
  .b2{width:38vw;height:38vw;bottom:-16%;left:-10%;background:#0f766e;opacity:.25;animation:f2 32s ease-in-out infinite}
  .b3{width:28vw;height:28vw;top:42%;left:30%;background:#38bdf8;opacity:.14;animation:f1 36s ease-in-out infinite reverse}
  @keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5vw,7vh) scale(1.12)}}
  @keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-5vh) scale(1.08)}}

  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* ===== language switcher ===== */
  .lang-switch{position:fixed;top:16px;left:16px;z-index:50;display:flex;gap:6px;background:var(--panel);
    border:1px solid var(--border);border-radius:999px;padding:5px;backdrop-filter:blur(14px)}
  .flag{width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:17px;border:2px solid transparent;transition:.25s var(--ease);overflow:hidden;background:rgba(255,255,255,.05)}
  .flag:hover{transform:scale(1.08)}
  .flag.active{border-color:var(--accent);box-shadow:0 0 12px rgba(56,189,248,.45)}
  .flag img{width:100%;height:100%;object-fit:cover}

  /* ===== hero ===== */
  header{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 20px 30px}
  .badge{font-size:12.5px;font-weight:600;color:var(--accent-soft);background:var(--panel);border:1px solid var(--border);
    padding:7px 18px;border-radius:999px;letter-spacing:.04em;margin-bottom:22px;backdrop-filter:blur(12px)}
  h1.name{font-size:clamp(36px,7vw,70px);font-weight:700;margin:0;line-height:1.3}
  h1 .grad{background:linear-gradient(120deg,var(--accent-soft),var(--teal));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .role{font-size:clamp(15px,2.4vw,20px);color:var(--muted);margin-top:10px;font-weight:300}
  .role b{color:var(--text);font-weight:600}
  .hero-btns{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:inherit;text-decoration:none;font-size:13.5px;font-weight:700;padding:13px 27px;border-radius:999px;
    transition:.25s var(--ease);cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px}
  .btn.primary{background:linear-gradient(150deg,#7dd3fc,#38bdf8);color:#06202e;box-shadow:0 12px 30px -8px rgba(56,189,248,.4)}
  .btn.primary:hover{transform:translateY(-2px)}
  .btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--border);backdrop-filter:blur(10px)}
  .btn.ghost:hover{background:rgba(255,255,255,.09)}

  section{padding:70px 0}
  .sec-title{display:flex;align-items:center;gap:14px;margin-bottom:34px}
  .sec-title h2{font-size:clamp(22px,3.5vw,30px);margin:0;font-weight:800;white-space:nowrap}
  .sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(to left,var(--border),transparent)}
  html[dir="rtl"] .sec-title::after{background:linear-gradient(to right,var(--border),transparent)}

  .about-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(18px);padding:30px 34px;font-size:15.5px;color:var(--muted)}
  .about-card b{color:var(--text)}
  .skills{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
  .skill{font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.06);
    border:1px solid var(--border);transition:.2s}
  .skill:hover{border-color:var(--accent);color:var(--accent-soft);transform:translateY(-2px)}

  /* ===== works — vertical reels cards ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}

  .work{position:relative;border-radius:22px;overflow:hidden;background:var(--panel);border:1px solid var(--border);
    cursor:pointer;transition:.35s var(--ease);aspect-ratio:16/9}
  .work:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 24px 50px -18px rgba(56,189,248,.3)}
  .work img{width:100%;height:100%;object-fit:cover;display:block;transition:.5s var(--ease)}
  .work.playing:not(.expanded) img{filter:brightness(.35) saturate(.6)}
  .work:hover:not(.playing):not(.expanded) img{transform:scale(1.05)}
  .work video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
  .work.playing video{display:block}
  .work.expanded video{object-fit:contain}

  .work .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(4,10,18,.95) 0%,transparent 55%);
    display:flex;flex-direction:column;justify-content:flex-end;padding:16px;pointer-events:none;transition:.3s}
  .work.playing:not(.expanded) .overlay,.work.expanded .overlay{opacity:0}
  .work.playing:not(.expanded):hover .overlay,.work.expanded:hover .overlay{opacity:1}
  .work .t{font-weight:800;font-size:14.5px}
  .work .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.6}
  .tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(56,189,248,.15);
    color:var(--accent-soft);backdrop-filter:blur(6px)}

  /* دکمه‌های شیشه‌ای سبک iOS */
  .glass-btn{backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
    box-shadow:0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s var(--ease);color:#fff}
  .glass-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.06)}
  .glass-btn:active{transform:scale(.96)}

  .play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
    width:64px;height:64px;border-radius:50%;opacity:0;z-index:3}
  .play-btn svg{width:26px;height:26px;fill:#fff;margin-right:3px}
  .work:hover:not(.playing):not(.expanded) .play-btn{opacity:1;transform:translate(-50%,-50%) scale(1)}

  .stop-btn{position:absolute;top:12px;left:12px;width:38px;height:38px;border-radius:50%;font-size:15px;z-index:4;display:none}
  .work.playing .stop-btn,.work.expanded .stop-btn{display:flex}

  .progress{position:absolute;bottom:0;right:0;height:3px;width:0%;background:var(--accent);z-index:4;transition:width .3s linear}

  /* ===== پخش ویدیو — لایه تمام‌صفحه، همیشه وسطِ دید کاربر ===== */
  #expandLayer{position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(5,10,18,.6);backdrop-filter:blur(26px) saturate(120%);-webkit-backdrop-filter:blur(26px) saturate(120%)}
  #expandLayer.open{display:flex}

  #expandCard{width:min(94vw,calc(78vh*16/9));border-radius:20px;overflow:hidden;background:#000;
    border:1px solid rgba(255,255,255,.16);box-shadow:0 40px 120px -20px rgba(0,0,0,.85);
    opacity:0;transform:scale(.82) translateY(30px);
    transition:opacity .55s var(--ease), transform .55s var(--ease)}
  #expandLayer.open #expandCard{opacity:1;transform:none}
  #expandCard video{display:block;width:100%;height:auto;max-height:72vh}
  #expandMeta{padding:13px 18px;background:rgba(10,18,30,.88);backdrop-filter:blur(14px);
    display:flex;align-items:center;justify-content:space-between;gap:14px}
  #expandTitle{font-weight:800;font-size:15px;color:#fff}
  .glass-btn{backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
    box-shadow:0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s var(--ease);color:#fff}
  .glass-btn:hover{background:rgba(255,255,255,.2)}
  #expandClose{width:38px;height:38px;border-radius:50%;font-size:14px;flex-shrink:0}

  .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .contact-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;
    text-decoration:none;color:var(--text);transition:.3s var(--ease);backdrop-filter:blur(12px)}
  .contact-card:hover{transform:translateY(-4px);border-color:var(--teal)}
  .contact-card .ico{font-size:26px}
  .contact-card .t{font-weight:700;margin-top:8px;font-size:14px}
  .contact-card .v{font-size:12px;color:var(--muted);direction:ltr}

  footer{text-align:center;color:var(--faint);font-size:12px;padding:36px 0 46px}

  @media(max-width:640px){
    section{padding:52px 0}
    .about-card{padding:24px 20px}
    .lang-switch{top:10px;left:10px}
  }
</style>
</head>
<body>

<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="expandLayer">
  <div id="expandCard">
    <video playsinline loop controls></video>
    <div id="expandMeta">
      <span id="expandTitle"></span>
      <button class="glass-btn" id="expandClose">✕</button>
    </div>
  </div>
</div>

<header>
  <div class="badge" id="badge"></div>
  <h1 class="name"><span id="helloTxt"></span> <span class="grad" id="nameTxt"></span></h1>
  <div class="role" id="roleTxt"></div>
  <div class="hero-btns">
    <a class="btn primary" href="#works" id="ctaWorks"></a>
    <a class="btn ghost" href="#contact" id="ctaContact"></a>
  </div>
</header>

<div class="wrap">
<section id="about" class="reveal">
  <div class="sec-title reveal"><h2 id="aboutTitle"></h2></div>
  <div class="about-card reveal d1">
    <span id="aboutHtml"></span>
    <div class="skills" id="skillsRow"></div>
  </div>
</section>

<section id="works" class="reveal">
  <div class="sec-title"><h2 id="worksTitle"></h2></div>
  <div class="grid" id="worksGrid"></div>
</section>

<section id="contact" class="reveal">
  <div class="sec-title"><h2 id="contactTitle"></h2></div>
  <div class="contact-grid">
    <a class="contact-card" href="https://t.me/editoramx" target="_blank" rel="noopener">
      <div class="ico">✈️</div><div class="t" id="tgLbl"></div><div class="v">@editoramx</div>
    </a>
    <a class="contact-card" href="https://instagram.com/montajara" target="_blank" rel="noopener">
      <div class="ico">📸</div><div class="t" id="igLbl"></div><div class="v">@montajara</div>
    </a>
    <a class="contact-card" href="tel:+989917998607" dir="ltr">
      <div class="ico">📞</div><div class="t" id="phLbl"></div><div class="v">+98 917 799 86 07</div>
    </a>
    <a class="contact-card" href="mailto:mrcrank79@gmail.com">
      <div class="ico">📧</div><div class="t" id="emLbl"></div><div class="v">mrcrank79@gmail.com</div>
    </a>
  </div>
</section>
</div>

<footer id="footerTxt"></footer>

<script src="works.js"></script>
<script>
(function(){
  "use strict";
  let currentLang = localStorage.getItem('pf_lang') || 'en';
  const layer   = document.getElementById('expandLayer');
  const card    = document.getElementById('expandCard');
  const boxVid  = card.querySelector('video');

  function renderWorks(){
    const grid = document.getElementById('worksGrid');
    grid.innerHTML = WORKS.map((w,i) => `
      <div class="work" data-i="${i}">
        <div class="thumb">
          <img loading="lazy" src="${w.thumb}" alt="">
          <div class="big-word">${(w.big&&w.big[currentLang])||''}</div>
          <div class="play-btn glass-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        </div>
        <div class="overlay">
          <div class="t">${w.title[currentLang]}</div>
          <div class="d">${w.desc[currentLang]}</div>
          <div class="tag-row">${(w.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        </div>
      </div>`).join('');

    grid.querySelectorAll('.work').forEach(c => {
      const w = WORKS[+c.dataset.i];
      c.addEventListener('click', () => openPlayer(w.video, w.title[currentLang]));
    });
  }

  // باز می‌شود درست وسطِ همان چیزی که کاربر روی صفحه می‌بیند — همیشه
  function openPlayer(src, title){
    document.getElementById('expandTitle').textContent = title;
    boxVid.src = src;
    layer.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => boxVid.play().catch(()=>{}), 250);   // صبر برای انیمیشن آرام
  }
  function closePlayer(){
    boxVid.pause(); boxVid.removeAttribute('src'); boxVid.load();
    layer.classList.remove('open');
    document.body.style.overflow = '';
  }
  layer.addEventListener('click', e => { if(e.target === layer) closePlayer(); });
  document.getElementById('expandClose').addEventListener('click', closePlayer);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closePlayer(); });

  function applyLang(lang){
    currentLang = lang;
    localStorage.setItem('pf_lang', lang);
    const T = I18N[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = T.dir;
    const set = (id,val) => { const el=document.getElementById(id); if(el) el.innerHTML = val; };
    ['badge','helloTxt','nameTxt','roleTxt','ctaWorks','ctaContact','aboutTitle',
     'aboutHtml','worksTitle','contactTitle','tgLbl','igLbl','emLbl','footerTxt']
      .forEach(id => set(id, T[id]));
    set('phLbl', T.phone || 'Phone');
    document.title = lang === 'fa' ? 'محمد — تدوینگر ویدیو | نمونه‌کارها' : 'Mohammad — Video Editor | Portfolio';
    document.querySelectorAll('.flag').forEach(f => f.classList.toggle('active', f.dataset.lang === lang));
    renderWorks();
  }

  document.querySelectorAll('.flag').forEach(f =>
    f.addEventListener('click', () => applyLang(f.dataset.lang)));

  // موشن اسکرول ساده
  const io = new IntersectionObserver(es =>
    es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),
    { threshold: .1 });

  applyLang(currentLang);
  document.querySelectorAll('#about, #works, #contact, #about .sec-title, #about .about-card')
    .forEach(el => { el.classList.add('reveal'); io.observe(el); });
})();</script>
</body>
</html>
